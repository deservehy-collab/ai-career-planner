# Project 知识库 —— 医药护理：临床检验全流程与室内质控（进阶）
name: 临床检验全流程与室内质控
domain: healthcare
difficulty: advanced
covers_skills: [临床检验基础, 标本采集与处理, 检验仪器操作与维护, 实验室质量控制, 检验结果审核, 实验室安全与生物安全, 检验信息系统, 临床沟通基础]
prerequisites: [基础护理操作, 无菌操作与院感防控]
tech_stack: [生化分析仪, 血细胞分析仪, LIS 系统, 质控品, 室内质控记录表]
stage_hint: 从标本接收到报告发布走完一遍，并把质控做扎实
deliverable: 一份检验项目 SOP、室内质控记录与结果审核案例集
acceptance_criteria:
  - SOP 写清标本要求、操作步骤、报警处理与报告规则
  - 质控记录含规则判读，失控时有排查过程与纠正措施
  - 审核案例覆盖危急值、可疑结果与复检判断
  - 生物安全与废弃物处置环节符合规范并留有记录
estimated_weeks: 4
