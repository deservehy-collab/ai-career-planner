# Project 知识库 —— 体育：会员体态评估与周期训练计划（高阶）
name: 会员体态评估与周期训练计划
domain: sports
difficulty: advanced
covers_skills: [体态评估, 体能训练方法, 训练计划设计, 营养与体重管理, 器械使用与保护, 会员沟通与课程销售]
prerequisites: [运动解剖学, 体能训练方法]
tech_stack: [体态评估表, 训练记录表, 体测仪, 心率监测设备]
stage_hint: 按真实会员场景完成评估、计划、执行与复评闭环
deliverable: 一份评估报告、8 周训练计划、训练记录与复评对比
acceptance_criteria:
  - 评估含静态观察与动态筛查，异常点有对应训练策略
  - 计划分阶段写明频率、强度、动作与进阶条件
  - 每个动作标注保护方式与常见代偿，风险动作有替代方案
  - 复评用同一套指标对比，变化有解释并调整后续计划
estimated_weeks: 5
