# Project 知识库 —— 设计：移动端界面与组件库（高级）
name: 移动端界面与组件库
domain: design
difficulty: advanced
covers_skills: [Figma, 用户界面规范, 交互设计基础, 原型设计, 设计组件库, 前端协作与交付, 可用性测试]
prerequisites: [Figma, 用户界面规范, 交互设计基础]
tech_stack: [Figma, 组件变体, 原型连线, 标注插件]
stage_hint: 综合项目，把一条完整任务做成可交付、可验证的界面方案
deliverable: 一套高保真界面、可点击原型、组件库与交付标注
acceptance_criteria:
  - 主流程与异常、空、加载状态均有界面
  - 组件有尺寸与状态变体，改一处可全局生效
  - 原型可完整演示任务，能找到至少 3 个可用性问题
  - 标注包含间距、字号、交互说明，前端可直接实现
estimated_weeks: 5
